name: Test Build

on:
  push:
    branches-ignore:
      - comp-and-judge
  pull_request:
    branches-ignore:
      - comp-and-judge
  workflow_dispatch:

jobs:
  build-and-run-test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv64, loongarch64]
        include:
          - arch: riscv64
            runner: ubuntu-latest
            qemu_pkg: qemu-system-riscv64
            target: riscv64gc-unknown-none-elf
            platform: virt
          # The kernel is linked at physical 0x8000_0000, which is high memory
          # only on QEMU >= 9.0 (8.2 still puts high memory at 0x9000_0000), so
          # this leg cannot use the qemu 8.2 shipped by ubuntu-24.04.
          - arch: loongarch64
            runner: ubuntu-26.04
            qemu_pkg: qemu-system-misc
            target: loongarch64-unknown-none-softfloat
            platform: virt
          - arch: x86_64
            runner: ubuntu-latest
            qemu_pkg: qemu-system-x86
            target: x86_64-unknown-none
            platform: acpi_compat
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup rust nightly
        run: rustup component add rust-src llvm-tools

      - name: Install cargo-binutils
        run: cargo install cargo-binutils

      - name: Setup QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.qemu_pkg }} expect dosfstools psmisc

      - name: Verify QEMU for ${{ matrix.arch }}
        run: command -v qemu-system-${{ matrix.arch }}

      - name: Configure
        run: ./configure

      - name: Run build for ${{ matrix.arch }} targets
        run: |
          make build ARCH=${{ matrix.arch }} MODE=release
          zstd -k build/boot-${{ matrix.arch }}-${{ matrix.platform }}.img

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eonix-kernel-and-image-${{ matrix.arch }}
          path: |
            build/${{ matrix.target }}/release/eonix_kernel
            build/boot-${{ matrix.arch }}-${{ matrix.platform }}.img.zst

      - name: Test run for ${{ matrix.arch }}
        run: |
          echo "Fixing permissions for /dev/kvm..."
          sudo adduser $USER kvm || true
          bash script/test.sh
        env:
          ARCH: ${{ matrix.arch }}
          QEMU_ACCEL: ''
          TEST_TIMEOUT: 180
        timeout-minutes: 15

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.arch }}.log
          path: build/test-*.log
